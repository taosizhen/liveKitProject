<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="在线会议协助平台">
  <!-- 品牌渐变底 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.62">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="225" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="225" fill="url(#glow)"/>
  <!-- 圆桌 -->
  <circle cx="512" cy="512" r="168" fill="none" stroke="#FFFFFF" stroke-width="34"/>
  <!-- 顶部席位：举手/发言高亮 -->
  <circle cx="512" cy="190" r="84" fill="none" stroke="#FFFFFF" stroke-opacity="0.66" stroke-width="9"/>
  <circle cx="512" cy="190" r="66" fill="#FBBF24"/>
  <!-- 其余席位 -->
  <circle cx="834" cy="512" r="66" fill="#FFFFFF"/>
  <circle cx="512" cy="834" r="66" fill="#FFFFFF"/>
  <circle cx="190" cy="512" r="66" fill="#FFFFFF"/>
</svg>
