name: meeting_mobile
description: 在线会议协助平台 · Flutter 移动端（登录 / 会议列表 / 会议详情 / 一键入会 / 视频标注）
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  # 路由（支持深链：推送点击直达会议）
  go_router: ^14.2.0
  # HTTP 客户端（含 401 统一刷新拦截器）
  dio: ^5.4.0
  # LiveKit 实时音视频（与 Web 端同协议）
  livekit_client: ^2.13.1
  # 聊天 WebSocket
  web_socket_channel: ^3.0.0
  # refresh_token 安全存储（Android Keystore / iOS Keychain）
  flutter_secure_storage: ^9.2.2
  # 轻量偏好存储（登录用户缓存）
  shared_preferences: ^2.2.3
  # 网络状态监听（Wi-Fi ↔ 蜂窝切换后自动重连）
  connectivity_plus: ^7.3.1
  # 会议期间保持屏幕常亮
  wakelock_plus: ^1.2.5
  # 时间格式化
  intl: ^0.19.0
  # 相册/相机选图（头像上传）
  image_picker: ^1.1.2
  flutter_background: ^1.3.1
  flutter_webrtc: ^1.6.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
